<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GitHolo — 3D Holographic Developer Trading Cards">
  <rect width="1200" height="630" fill="#05080f"/>
  <defs>
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="cardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="url(#holoGrad)" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Floating holographic cards background -->
  <g opacity="0.08" filter="url(#cardGlow)">
    <g transform="translate(100, 150) rotate(-15)">
      <path d="M -80 -80 L 80 -80 L 100 -60 L -60 -60 Z" fill="url(#holoGrad)"/>
      <path d="M 80 -80 L 100 -60 L 100 60 L 80 80 Z" fill="url(#holoGrad)" opacity="0.6"/>
      <path d="M -80 -60 L 80 -60 L 80 80 L -80 80 Z" fill="#05080f" stroke="url(#holoGrad)" stroke-width="1"/>
    </g>
    <g transform="translate(1000, 400) rotate(12)">
      <path d="M -60 -60 L 60 -60 L 75 -45 L -45 -45 Z" fill="url(#holoGrad)"/>
      <path d="M 60 -60 L 75 -45 L 75 45 L 60 60 Z" fill="url(#holoGrad)" opacity="0.6"/>
      <path d="M -60 -45 L 60 -45 L 60 60 L -60 60 Z" fill="#05080f" stroke="url(#holoGrad)" stroke-width="1"/>
    </g>
  </g>

  <!-- Main card (hero) -->
  <g transform="translate(180, 180)" filter="url(#cardGlow)">
    <!-- 3D card -->
    <path d="M -100 -100 L 100 -100 L 125 -75 L -75 -75 Z" fill="url(#holoGrad)" opacity="0.25"/>
    <path d="M 100 -100 L 125 -75 L 125 75 L 100 100 Z" fill="url(#holoGrad)" opacity="0.5"/>
    <path d="M -100 -75 L 100 -75 L 100 100 L -100 100 Z" fill="#080d1a" stroke="url(#holoGrad)" stroke-width="3"/>
    <path d="M -100 -100 L -75 -75 L 125 -75 L 100 -100 Z" fill="url(#holoGrad)" opacity="0.35"/>
    
    <!-- Card content: scanlines -->
    <g stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="8,12">
      <line x1="-80" y1="-40" x2="80" y2="-40"/>
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="-80" y1="40" x2="80" y2="40"/>
      <line x1="-80" y1="80" x2="80" y2="80"/>
    </g>
    
    <!-- Corner brackets -->
    <g stroke="url(#holoGrad)" stroke-width="4" fill="none">
      <path d="M -95 -70 H -60 M -95 -70 V -35"/>
      <path d="M 95 -70 H 60 M 95 -70 V -35"/>
      <path d="M -95 95 H -60 M -95 95 V 60"/>
      <path d="M 95 95 H 60 M 95 95 V 60"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="450" y="240" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="64" fill="url(#holoGrad)" letter-spacing="-1">
    <tspan fill="#00f5ff">Git</tspan><tspan fill="#7c3aed">Holo</tspan>
  </text>
  
  <text x="450" y="300" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8b9dc3" letter-spacing="4" text-transform="uppercase">
    3D Holographic Trading Cards
  </text>

  <!-- Features -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b" transform="translate(450, 360)">
    <g transform="translate(-200, 0)">
      <rect x="-90" y="-20" width="180" height="40" rx="8" fill="#080d1a" stroke="#00f5ff" stroke-width="1" opacity="0.8"/>
      <text x="0" y="6" text-anchor="middle" fill="#00f5ff">WebGL Shaders</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-90" y="-20" width="180" height="40" rx="8" fill="#080d1a" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
      <text x="0" y="6" text-anchor="middle" fill="#7c3aed">Zero Watermarks</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="-90" y="-20" width="180" height="40" rx="8" fill="#080d1a" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
      <text x="0" y="6" text-anchor="middle" fill="#00ff88">Open Source</text>
    </g>
  </g>

  <!-- Ecosystem -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#4a5568" transform="translate(450, 450)">
    <text x="-250" y="0" text-anchor="end">Ecosystem:</text>
    <g transform="translate(-100, -8)">
      <circle cx="0" cy="8" r="6" fill="#10b981" opacity="0.2"/>
      <text x="16" y="12" fill="#10b981">ReadmeCraft</text>
      <text x="16" y="28" fill="#64748b" font-size="10">readme.bharatdn.com</text>
    </g>
    <g transform="translate(180, -8)">
      <circle cx="0" cy="8" r="6" fill="#f59e0b" opacity="0.2"/>
      <text x="16" y="12" fill="#f59e0b">GitChronicle</text>
      <text x="16" y="28" fill="#64748b" font-size="10">gitchronicle.bharatdn.com</text>
    </g>
  </g>

  <!-- Domain -->
  <g transform="translate(450, 530)">
    <rect x="-160" y="-20" width="320" height="50" rx="12" fill="#080d1a" stroke="url(#holoGrad)" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="20" fill="url(#holoGrad)">
      githolo.bharatdn.com
    </text>
  </g>

  <!-- Author -->
  <text x="1080" y="600" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2a3a4f">
    Built by ErBharatMalhotra
  </text>
</svg>